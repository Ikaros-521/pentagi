# =====================================================================
# 多渠道配置(本地功能扩展):在下面追加 providers 列表即可添加新渠道,
# 无需改环境变量。保存后默认 60 秒内自动生效
# (间隔由 LLM_SERVER_CONFIG_RELOAD 控制,重启 pentagi 容器也可)。
# 每个渠道必填 name/url/key;type 选渠道门类,不填为 custom(OpenAI 兼容),
# 也可用 glm / deepseek / kimi / qwen / minimax / mistral / xai / openai /
# anthropic / gemini / ollama(此时可省略 url,走官方端点);
# bedrock 不支持,仍走环境变量。model 为该渠道默认模型;
# 各 agent 块可选,不填时回落到渠道 model。示例:
#
# providers:
#   - name: my-newapi
#     url: http://new-api:3000/v1
#     key: sk-xxxx
#     model: gpt-4o
#   - name: glm-cloud
#     type: glm
#     key: sk-yyyy
#     model: glm-4.6
#     primary_agent:
#       model: glm-4.6
#       max_tokens: 16384
#   - name: glm-openai-compat
#     url: https://open.bigmodel.cn/api/paas/v4
#     key: sk-zzzz
#     model: glm-4.6
#
# 注意:渠道从文件移除后不会自动从系统删除,需在 Settings → Providers 手动删除。
# Settings 页面任何类型(除 bedrock)都能新建 provider,但 UI 表单不含 key
# 输入框 —— key 请通过本文件的 providers 列表或环境变量提供。
# =====================================================================